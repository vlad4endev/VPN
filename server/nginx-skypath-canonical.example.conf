# Пример: канонический домен www + редирект apex с сохранением пути + прокси /api/ на Node (3001)
# Подставьте пути к сертификатам Let's Encrypt и при необходимости скорректируйте upstream.
#
# Шаг установки (типично):
#   sudo cp nginx-skypath-canonical.example.conf /etc/nginx/sites-available/skypath.fun
#   sudo ln -sf /etc/nginx/sites-available/skypath.fun /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Если используете Nginx Proxy Manager / OpenResty с другим layout — перенесите те же идеи:
#   apex → 301/308 на https://www.skypath.fun$request_uri
#   www → location /api/ → proxy_pass http://127.0.0.1:3001

# -----------------------------------------------------------------------------
# Шаг 1: HTTP apex → HTTPS www (с сохранением пути и query)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name skypath.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://www.skypath.fun$request_uri;
}

# -----------------------------------------------------------------------------
# Шаг 1 (HTTPS): apex → канонический www (ОБЯЗАТЕЛЬНО $request_uri, не обрезать /api/...)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skypath.fun;

    ssl_certificate     /etc/letsencrypt/live/skypath.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skypath.fun/privkey.pem;

    return 301 https://www.skypath.fun$request_uri;
}

# -----------------------------------------------------------------------------
# Шаг 2: Канонический сайт www — SPA + API на Node
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.skypath.fun;

    ssl_certificate     /etc/letsencrypt/live/www.skypath.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.skypath.fun/privkey.pem;

    # HTTP → HTTPS для www (если отдельный server на 80)
    # Или объедините с certbot — главное: на 443 отдавать только HTTPS.

    # API: Node.js (должен слушать 127.0.0.1:3001 или 0.0.0.0:3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # WebSocket (если приложение или n8n поднимают WS по тому же хосту)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection       $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Если статика/SPA отдаётся с диска, а не через Node — замените location / на root + try_files
    # и оставьте только location /api/ как выше.
}

# Для map $http_upgrade $connection_upgrade (один раз в http {})
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
