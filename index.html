    <!-- Telegram Mini App: SDK загружается асинхронно (не блокирует открытие). initData + перехват fetch. -->
    <script>
    (function() {
      window.__TELEGRAM_INIT_DATA = null;
      function applyTmaInit(reason) {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
          try { tg.ready(); } catch (e) {}
          try { if (tg.expand) tg.expand(); } catch (e) {}
          try {
            var v = tg.version ? parseFloat(tg.version) : NaN;
            if (tg.enableClosingConfirmation && (isNaN(v) || v >= 6.1)) tg.enableClosingConfirmation(false);
          } catch (e) {}
        }

        // 1) Обычный путь: initData от Telegram WebApp
        if (tg && typeof tg.initData === 'string' && tg.initData.length > 0) {
          window.__TELEGRAM_INIT_DATA = tg.initData;
          try { sessionStorage.setItem('tg_init_data', window.__TELEGRAM_INIT_DATA); } catch (e) {}
          try {
            var uid = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
            console.log('TMA detected (initData ok)', { reason: reason || 'direct', userId: uid || null, initDataLength: tg.initData.length });
          } catch (e) {}
          try { window.dispatchEvent(new CustomEvent('telegram-initdata-ready')); } catch (e2) {}
          return;
        }

        // Диагностика: Telegram WebApp есть, но initData пустой
        if (tg && (!tg.initData || tg.initData.length === 0)) {
          try {
            console.log('TMA WebApp present, but initData empty', {
              reason: reason || 'direct',
              platform: tg.platform,
              version: tg.version,
              initDataLength: (tg.initData && tg.initData.length) ? tg.initData.length : 0
            });
          } catch (e) {}
        }

        // 2) Fallback: восстановление initData из hash / sessionStorage (после редиректов)
        var hash = window.location.hash || '';
        if (hash.indexOf('tgWebAppData=') !== -1) {
          try {
            var start = hash.indexOf('tgWebAppData=') + 13;
            var end = hash.indexOf('&tgWebAppVersion');
            if (end === -1) end = hash.indexOf('&eventId');
            if (end === -1) end = hash.length;
            var raw = hash.substring(start, end);
            if (raw) {
              window.__TELEGRAM_INIT_DATA = decodeURIComponent(raw);
              try { sessionStorage.setItem('tg_init_data', window.__TELEGRAM_INIT_DATA); } catch (e2) {}
              try { console.log('TMA initData restored from hash', { reason: reason || 'hash', length: window.__TELEGRAM_INIT_DATA.length }); } catch (e3) {}
              try { window.dispatchEvent(new CustomEvent('telegram-initdata-ready')); } catch (e4) {}
            }
          } catch (e) {}
        }
        if (!window.__TELEGRAM_INIT_DATA && typeof sessionStorage !== 'undefined') {
          var ref = typeof document !== 'undefined' ? (document.referrer || '') : '';
          if (ref.indexOf('t.me') !== -1 || ref.indexOf('telegram.org') !== -1 || ref.indexOf('telegram') !== -1) {
            try {
              var stored = sessionStorage.getItem('tg_init_data');
              if (stored) window.__TELEGRAM_INIT_DATA = stored;
            } catch (e) {}
          }
        }
        if (window.__TELEGRAM_INIT_DATA && typeof sessionStorage !== 'undefined') {
          try { sessionStorage.setItem('tg_init_data', window.__TELEGRAM_INIT_DATA); } catch (e) {}
          try { window.dispatchEvent(new CustomEvent('telegram-initdata-ready')); } catch (e2) {}
        }
      }
      applyTmaInit('boot');
      if (window.Telegram && window.Telegram.WebApp) {
        try { window.Telegram.WebApp.expand(); } catch (e) {}
      }
      // В Mini App Telegram часто внедряет initData с задержкой — часто перепроверяем в первой секунде
      setTimeout(function() { applyTmaInit('t+100ms'); }, 100);
      setTimeout(function() { applyTmaInit('t+250ms'); }, 250);
      setTimeout(function() { applyTmaInit('t+500ms'); }, 500);
      setTimeout(function() { applyTmaInit('t+800ms'); }, 800);
      setTimeout(function() { applyTmaInit('t+1200ms'); }, 1200);
      setTimeout(function() { applyTmaInit('t+2500ms'); }, 2500);
      setTimeout(function() { applyTmaInit('t+5000ms'); }, 5000);
      var originalFetch = window.fetch;
      window.fetch = function(url, options) {
        options = options || {};
        options.headers = options.headers || {};
        if (window.__TELEGRAM_INIT_DATA) {
          if (options.headers instanceof Headers) {
            options.headers.append('X-Telegram-InitData', window.__TELEGRAM_INIT_DATA);
          } else if (typeof options.headers === 'object' && !Array.isArray(options.headers)) {
            options.headers['X-Telegram-InitData'] = window.__TELEGRAM_INIT_DATA;
          }
        }
        return originalFetch.call(this, url, options);
      };
      // На /t откладываем загрузку SDK, чтобы сначала сработало внедрение Telegram (иначе наш скрипт может перезаписать объект без initData)
      // Условие пути должно совпадать с isTmaPath() в src/features/telegram/utils/tmaPath.js
      var isTmaPath = (function() {
        var p = (window.location.pathname || '').replace(/\/+$/, '');
        return p === '/t' || p === '/telegram' || p === 't' || (p.indexOf('/t/') === 0 && p.length > 3);
      })();
      function loadSdk() {
        if (window.Telegram && window.Telegram.WebApp) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://telegram.org/js/telegram-web-app.js';
        s.onload = function() { applyTmaInit('sdk:onload'); };
        document.head.appendChild(s);
      }
      if (isTmaPath) {
        setTimeout(loadSdk, 700);
      } else {
        loadSdk();
      }
    })();
    </script>
